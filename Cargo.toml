[workspace]
resolver = "2"
members = [
    "crates/skterm-core",
    "crates/skterm-render",
    "crates/skterm-gui",
    "crates/skterm-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["skTerm Developers"]
license = "MIT"
repository = "https://github.com/ericsk/skTerm"

[workspace.dependencies]
# Internal workspace crates
skterm-core = { path = "crates/skterm-core" }
skterm-render = { path = "crates/skterm-render" }
skterm-gui = { path = "crates/skterm-gui" }

# Logging and error handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"

# Async & threading
crossbeam-channel = "0.5"
pollster = "0.4"

# Terminal & PTY
portable-pty = "0.8"
vte = "0.14"
unicode-width = "0.2"
bitflags = "2.6"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Rendering & Graphics
winit = { version = "0.30", features = ["rwh_06"] }
wgpu = "24.0"
bytemuck = { version = "1.21", features = ["derive"] }
cosmic-text = "0.12"
fontdue = "0.9"

# GUI & Preferences UI
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = { version = "0.31", default-features = false }

# Config & Utilities
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
notify = "8.0"
arboard = "3.4"
