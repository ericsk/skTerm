[workspace]
resolver = "2"
members = [
    "crates/skterm-core",
    "crates/skterm-render",
    "crates/skterm-gui",
    "crates/skterm-app",
]

# The hot paths here are per-cell/per-byte loops that cross crate boundaries
# (skterm-core grid + VT -> skterm-render draw loop). The default release profile
# (lto = false, codegen-units = 16) blocks that inlining entirely.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Dependencies are optimized even in debug builds: a GPU terminal is unusable when
# wgpu/cosmic-text/image run unoptimized. Our own crates stay unoptimized so that
# debugging and incremental rebuilds remain fast.
[profile.dev.package."*"]
opt-level = 2

[workspace.package]
version = "0.2.1"
edition = "2021"
authors = ["skTerm Developers"]
license = "MIT"
repository = "https://github.com/ericsk/skTerm"

[workspace.dependencies]
# Internal workspace crates
skterm-core = { path = "crates/skterm-core" }
skterm-render = { path = "crates/skterm-render" }
skterm-gui = { path = "crates/skterm-gui" }

# Logging and error handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"

# Async & threading
crossbeam-channel = "0.5"
pollster = "0.4"

# Terminal & PTY
portable-pty = "0.8"
vte = "0.14"
unicode-width = "0.2"
bitflags = "2.6"
base64 = "0.22"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Rendering & Graphics
winit = { version = "0.30", features = ["rwh_06"] }
wgpu = "30.0"
bytemuck = { version = "1.21", features = ["derive"] }
fontdue = "0.9"
ab_glyph = "0.2"

# GUI & Preferences UI
egui = "0.37"
egui-wgpu = "0.37"
egui-winit = { version = "0.37", default-features = false }

# Config & Utilities
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
notify = "8.0"
arboard = "3.4"
